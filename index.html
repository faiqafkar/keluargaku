<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0A0A0A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="KeluargaKu"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.svg"/>
<title>KeluargaKu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FAF8F5;
  --card:#FFFFFF;
  --card2:#F5F2EE;
  --teal:#6B8F71;
  --teal2:#4A7A52;
  --teal-dim:rgba(107,143,113,0.12);
  --teal-dim2:rgba(107,143,113,0.06);
  --red:#C0392B;
  --red-dim:rgba(192,57,43,0.1);
  --green:#6B8F71;
  --amber:#C07A2A;
  --txt:#1C1410;
  --txt2:#7A6A5A;
  --txt3:#B8A898;
  --border:#EAE4DC;
  --radius:20px;
  --radius-sm:14px;
  --radius-xs:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:0;}

/* Layout */
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto;}
.content{flex:1;padding:0 0 90px;overflow-x:hidden;}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#000;}
.topbar-greet p:first-child{font-size:11px;color:var(--txt2);}
.topbar-greet p:last-child{font-size:14px;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--bg);}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* Hero card */
.hero{margin:8px 16px 20px;background:linear-gradient(135deg,#2C4A35 0%,#1E3528 50%,#152A1E 100%);border-radius:24px;padding:24px 22px 20px;position:relative;overflow:hidden;border:none;box-shadow:0 4px 20px rgba(44,74,53,0.2);}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(107,143,113,0.3) 0%,transparent 65%);pointer-events:none;}
.hero::after{content:'';position:absolute;bottom:-40px;left:40px;width:140px;height:140px;background:radial-gradient(circle,rgba(107,143,113,0.15) 0%,transparent 65%);pointer-events:none;}
.hero-label{font-size:10px;color:rgba(0,201,167,0.6);font-weight:600;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;}
.hero-amount{font-family:'Fraunces',serif;font-size:36px;font-weight:700;color:#fff;letter-spacing:-1px;margin-bottom:4px;line-height:1.1;}
.hero-sub{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:18px;}
.hero-stats{display:flex;gap:10px;margin-bottom:18px;}
.hero-stat{flex:1;background:rgba(255,255,255,0.05);border-radius:14px;padding:10px 12px;border:1px solid rgba(255,255,255,0.06);}
.hero-stat-lbl{display:flex;align-items:center;gap:5px;margin-bottom:4px;}
.hero-stat-lbl span:first-child{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.hero-stat-lbl p{font-size:9px;color:rgba(255,255,255,0.4);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.hero-stat-val{font-size:14px;font-weight:700;}
.hero-bar-wrap{margin-bottom:0;}
.hero-bar-lbl{display:flex;justify-content:space-between;margin-bottom:5px;}
.hero-bar-lbl p{font-size:9px;color:rgba(255,255,255,0.35);}
.hero-bar{height:3px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
.hero-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);}

/* Quick actions */
.quick-actions{display:flex;gap:0;padding:0 16px;margin-bottom:24px;}
.qa{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:none;background:none;font-family:inherit;}
.qa-icon{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.qa-lbl{font-size:11px;font-weight:500;color:var(--txt2);}

/* Section */
.sec{padding:0 16px;margin-bottom:20px;}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sec-hdr h3{font-size:15px;font-weight:700;}
.sec-hdr a{font-size:12px;color:var(--teal);font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit;}

/* Wallet cards - horizontal scroll */
.wallet-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px;margin-bottom:24px;scrollbar-width:none;}
.wallet-scroll::-webkit-scrollbar{display:none;}
.wcard{flex-shrink:0;width:150px;background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--border);position:relative;overflow:hidden;}
.wcard::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.15;}
.wcard-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--txt3);margin-bottom:8px;}
.wcard-logo{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-bottom:10px;}
.wcard-name{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wcard-bal{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wcard-cur{font-size:9px;color:var(--txt3);margin-top:1px;}

/* Transaction list */
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.tx-item:last-child{border-bottom:none;}
.tx-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-info p:first-child{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-info p:last-child{font-size:11px;color:var(--txt2);margin-top:1px;}
.tx-amt{text-align:right;flex-shrink:0;}
.tx-amt p:first-child{font-size:13px;font-weight:700;}
.tx-amt p:last-child{font-size:10px;color:var(--txt3);margin-top:1px;}

/* Rows (overview) */
.orow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);}
.orow:last-child{border-bottom:none;}
.orow-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#F0EBE4;}
.orow-info{flex:1;min-width:0;}
.orow-info p:first-child{font-size:13px;font-weight:600;}
.orow-info p:last-child{font-size:10px;color:var(--txt2);margin-top:1px;}
.orow-right{text-align:right;flex-shrink:0;}
.orow-right p:first-child{font-size:13px;font-weight:700;}
.orow-right p:last-child{font-size:10px;color:var(--txt3);}
.orow-acts{display:flex;gap:4px;flex-shrink:0;margin-left:6px;}
.act-btn{width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.act-edit{background:#F0EBE4;}
.act-del{background:rgba(255,107,107,0.12);color:var(--red);}

/* Card container */
.ccard{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.ccard-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;}
.ccard-hdr h3{font-size:14px;font-weight:700;}
.add-btn{font-size:11px;font-weight:700;color:var(--teal);background:var(--teal-dim);border:none;border-radius:8px;padding:5px 11px;cursor:pointer;font-family:inherit;}
.empty{padding:16px;text-align:center;color:var(--txt3);font-size:12px;}

/* Progress bar */
.pbar{height:5px;background:rgba(255,255,255,0.08);border-radius:5px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:5px;transition:width .4s;}

/* Bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(250,248,245,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 0 28px;display:flex;justify-content:space-around;z-index:50;}
.bni{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:4px 20px;font-family:inherit;position:relative;}
.bni-icon{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;}
.bni-icon.on{background:var(--teal-dim);}
.bni-lbl{font-size:9px;font-weight:500;color:var(--txt3);transition:color .2s;}
.bni-lbl.on{color:var(--teal);font-weight:700;}

/* FAB */
.fab{position:fixed;bottom:90px;right:calc(50% - 220px);width:52px;height:52px;background:linear-gradient(135deg,var(--teal),var(--teal2));border:none;border-radius:18px;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 8px 24px rgba(0,201,167,0.35);display:flex;align-items:center;justify-content:center;z-index:40;font-weight:300;}
@media(max-width:480px){.fab{right:20px;}}

/* Modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.mbox{background:#FFFFFF;border-radius:28px 28px 0 0;width:100%;max-width:480px;padding:20px 20px 40px;max-height:88vh;overflow-y:auto;}
.drag-bar{width:36px;height:4px;background:#D8D0C8;border-radius:2px;margin:0 auto 20px;}
.mbox h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:16px;}
.mclose{position:absolute;right:20px;top:20px;border:none;background:#F0EBE4;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--txt);display:flex;align-items:center;justify-content:center;}
label{font-size:10px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:6px;}
input,select,textarea{width:100%;background:#F5F2EE;border:1.5px solid #E0D8CE;border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;color:var(--txt);min-height:46px;appearance:none;-webkit-appearance:none;margin-bottom:12px;}
input:focus,select:focus{border-color:var(--teal);background:#fff;}
select option{background:var(--card2);}
.btn-row{display:flex;gap:10px;margin-top:6px;}
.btn{border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;min-height:48px;flex:1;}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#000;}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--txt);}
.btn-danger{background:rgba(255,107,107,0.15);color:var(--red);}
.tab-sw{display:flex;gap:4px;background:#F0EBE4;border-radius:14px;padding:4px;margin-bottom:16px;}
.tab-sw button{flex:1;border:none;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--txt2);transition:all .2s;}
.tab-sw button.on{background:var(--teal);color:#000;}
.type-btns{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tbtn{border:1.5px solid var(--border);background:transparent;color:var(--txt2);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s;}
.tbtn.on{background:var(--teal);color:#000;border-color:var(--teal);}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.cbt{border:1.5px solid #E0D8CE;background:#F5F2EE;border-radius:12px;padding:10px 6px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:var(--txt2);transition:all .2s;min-height:56px;}
.cbt.on{border-color:var(--teal);background:var(--teal-dim);color:var(--teal);}
.info-box{background:#FFF8EC;border:1px solid #E8D5A8;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:#8B6520;}
.month-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.mbtn{border:1.5px solid var(--border);background:transparent;color:var(--txt2);border-radius:10px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.mbtn.on{border-color:var(--teal);background:var(--teal-dim);color:var(--teal);}

/* Laporan */
.pill{border:1.5px solid var(--border);background:transparent;border-radius:20px;padding:5px 13px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--txt2);white-space:nowrap;font-weight:500;}
.pill.on{background:var(--teal);color:#000;border-color:var(--teal);}
.months{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:0 16px;margin-bottom:16px;scrollbar-width:none;}
.months::-webkit-scrollbar{display:none;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:16px;}
.stat-c{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border);}
.stat-c .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.stat-c .val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:90px;padding:0 16px 16px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-wrap{width:100%;display:flex;gap:2px;align-items:flex-end;height:65px;}
.bar{flex:1;border-radius:4px 4px 0 0;min-height:0;transition:height .3s;}
.bar-lbl{font-size:8px;color:var(--txt3);font-weight:500;}
.bar-lbl.on{color:var(--teal);font-weight:700;}

/* Offline banner */
.offline-banner{background:#FFF8EC;border:1px solid #E8D5A8;border-radius:12px;padding:10px 14px;margin:0 16px 12px;display:none;align-items:center;gap:10px;}
.offline-banner p:first-child{font-size:12px;font-weight:700;color:#8B6520;}
.offline-banner p:last-child{font-size:10px;color:#B8902A;}

/* Target */
.tcard{background:var(--card);border-radius:18px;border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;}

/* Sidebar (desktop) */
@media(min-width:769px){
  body{background:#080808;}
  .app{flex-direction:row;max-width:1100px;margin:0 auto;min-height:100vh;}
  .sidebar-desk{width:240px;min-width:240px;background:#FFFFFF;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100vh;}
  .content{flex:1;padding:24px 28px 40px;overflow-y:auto;}
  .bnav{display:none;}
  .fab{display:none;}
  .topbar{display:none;}
}
@media(max-width:768px){
  .sidebar-desk{display:none;}
  .content{padding:0 0 90px;}
}
</style>
</head>
<body>
<div class="app">
  <!-- Desktop Sidebar -->
  <aside class="sidebar-desk" id="sidebarDesk">
    <div style="padding:0 20px 20px;border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
        <div style="width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal2));display:flex;align-items:center;justify-content:center;">
          <span style="font-size:16px;">🏠</span>
        </div>
        <div>
          <p style="font-size:14px;font-weight:700;">KeluargaKu</p>
          <p style="font-size:10px;color:var(--txt2);">Keuangan Keluarga</p>
        </div>
        <span class="sdot" id="syncDotDesk" style="background:var(--txt3);margin-left:auto;"></span>
      </div>
    </div>
    <nav style="flex:1;padding:12px 10px;">
      <button onclick="go('beranda')" id="sni-beranda" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:none;cursor:pointer;border-radius:12px;font-family:inherit;color:var(--txt2);font-size:13px;font-weight:500;margin-bottom:2px;">
        <span style="font-size:18px;">⊞</span> Beranda
      </button>
      <button onclick="go('laporan')" id="sni-laporan" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:none;cursor:pointer;border-radius:12px;font-family:inherit;color:var(--txt2);font-size:13px;font-weight:500;margin-bottom:2px;">
        <span style="font-size:18px;">◎</span> Laporan
      </button>
      <button onclick="go('overview')" id="sni-overview" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:none;cursor:pointer;border-radius:12px;font-family:inherit;color:var(--txt2);font-size:13px;font-weight:500;">
        <span style="font-size:18px;">◑</span> Overview
      </button>
    </nav>
    <div style="padding:10px 12px;">
      <button onclick="openAdd()" style="width:100%;background:linear-gradient(135deg,var(--teal),var(--teal2));border:none;border-radius:14px;padding:12px;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:8px;">+ Catat Transaksi</button>
      <button onclick="syncNow()" style="width:100%;background:rgba(255,255,255,0.05);border:none;border-radius:12px;padding:10px;color:var(--txt2);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
        🔄 Sync <span id="lastSyncDesk" style="font-size:10px;opacity:.6;"></span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <!-- Topbar (mobile) -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-avatar">K</div>
        <div class="topbar-greet">
          <p>Selamat datang 👋</p>
          <p>KeluargaKu</p>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" onclick="syncNow()" title="Sync">
          <span class="sdot" id="syncDotMob" style="background:var(--txt3);"></span>
          🔄
        </button>
        <button class="icon-btn" onclick="openAdd()">＋</button>
      </div>
    </div>

    <!-- Offline banner -->
    <div class="offline-banner" id="offlineBanner">
      <span>📵</span>
      <div>
        <p>Mode Offline</p>
        <p>Data akan sync saat ada koneksi</p>
      </div>
    </div>

    <!-- Pages -->
    <div id="page-beranda"></div>
    <div id="page-laporan" style="display:none"></div>
    <div id="page-overview" style="display:none"></div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bnav">
    <button class="bni" onclick="go('beranda')" id="bni-beranda">
      <div class="bni-icon on" id="bni-icon-beranda">⊞</div>
      <span class="bni-lbl on" id="bni-lbl-beranda">Beranda</span>
    </button>
    <button class="bni" onclick="go('laporan')" id="bni-laporan">
      <div class="bni-icon" id="bni-icon-laporan">◎</div>
      <span class="bni-lbl" id="bni-lbl-laporan">Laporan</span>
    </button>
    <button class="bni" onclick="go('overview')" id="bni-overview">
      <div class="bni-icon" id="bni-icon-overview">◑</div>
      <span class="bni-lbl" id="bni-lbl-overview">Overview</span>
    </button>
  </nav>

  <!-- FAB -->
  <button class="fab" onclick="openAdd()">＋</button>
</div>

<!-- Modal Container -->
<div id="modalContainer"></div>

<script>
const GS_URL='https://script.google.com/macros/s/AKfycbzlmuMP7mQ37AjAG669-vbe0q5HvkrpGxTRzeqS5cyt0698n36TYFh80X9fkBSizuaVXQ/exec';
const RESET_PW='Istrikuwanitatercantik';
const MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const OCATS=['Makan','Transport','Anak','Utilitas','Belanja','Kesehatan','Pendidikan','Derma','Lainnya'];

// Helpers
const fmt=(n,c='IDR')=>{
  const v=Number(n)||0;
  if(c==='IDR')return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(v);
  if(c==='SAR')return'SAR '+v.toLocaleString('id-ID');
  if(c==='USD')return'$'+v.toLocaleString('id-ID');
  if(c==='EUR')return'€'+v.toLocaleString('id-ID');
  if(c==='MYR')return'RM '+v.toLocaleString('id-ID');
  return c+' '+v.toLocaleString('id-ID');
};
const nowS=()=>new Date().toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const nowM=()=>new Date().getMonth();
const nowY=()=>new Date().getFullYear();
const uid=()=>Date.now()+''+Math.floor(Math.random()*1000);
const gc=p=>p>=100?'var(--red)':p>=75?'var(--amber)':'var(--teal)';
const catColor=i=>CAT_COLORS[i%CAT_COLORS.length];

// Sync dot
function setSyncDot(state){
  const colors={syncing:'var(--amber)',ok:'var(--teal)',err:'var(--red)',offline:'var(--amber)',idle:'rgba(255,255,255,0.15)'};
  const c=colors[state]||colors.idle;
  ['syncDotDesk','syncDotMob'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.style.background=c;el.style.animation=state==='syncing'?'pulse 1s infinite':'';}
  });
}

// GS
async function gsGet(sheet){
  const r=await fetch(GS_URL+'?sheet='+encodeURIComponent(sheet)+'&t='+Date.now(),{redirect:'follow'});
  const rows=await r.json();
  if(!Array.isArray(rows)||!rows.length)return[];
  return rows.map(row=>{try{return JSON.parse(row[0]);}catch(e){return null;}}).filter(Boolean);
}
async function gsSet(sheet,data){
  await fetch(GS_URL,{method:'POST',body:JSON.stringify({sheet,data:data.map(d=>[JSON.stringify(d)])}),redirect:'follow'});
}

// Load/Save
async function loadAll(){
  setSyncDot('syncing');
  // Cache first
  try{
    const cached=localStorage.getItem('kq_cache');
    if(cached){
      const c=JSON.parse(cached);
      wallets=c.wallets||[];txList=c.txList||[];budgets=c.budgets||[];
      obls=c.obls||[];assets=c.assets||[];targets=c.targets||[];
      checkLunas();renderAll();
    }
  }catch(e){}
  try{
    const [w,t,b,o,a,tg]=await Promise.all([
      gsGet('Kantong'),gsGet('Transaksi'),gsGet('Anggaran'),
      gsGet('Cicilan'),gsGet('Aset'),gsGet('Target')
    ]);
    wallets=w||[];txList=t||[];budgets=b||[];obls=o||[];assets=a||[];targets=tg||[];
    checkLunas();
    try{localStorage.setItem('kq_cache',JSON.stringify({wallets,txList,budgets,obls,assets,targets}));}catch(e){}
    setSyncDot('ok');
    const txt=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
    const el=document.getElementById('lastSyncDesk');
    if(el)el.textContent=txt;
    setTimeout(()=>setSyncDot('idle'),2000);
    renderAll();
  }catch(e){setSyncDot('err');setTimeout(()=>setSyncDot('idle'),3000);}
}
async function syncNow(){await loadAll();}
async function saveWallets(){setSyncDot('syncing');try{await gsSet('Kantong',wallets);setSyncDot('ok');setTimeout(()=>setSyncDot('idle'),2000);}catch(e){setSyncDot('err');}}
async function saveTx(){setSyncDot('syncing');try{await gsSet('Transaksi',txList);setSyncDot('ok');setTimeout(()=>setSyncDot('idle'),2000);}catch(e){setSyncDot('err');}}
async function saveBudgets(){setSyncDot('syncing');try{await gsSet('Anggaran',budgets);setSyncDot('ok');setTimeout(()=>setSyncDot('idle'),2000);}catch(e){setSyncDot('err');}}
async function saveObls(){setSyncDot('syncing');try{await gsSet('Cicilan',obls);setSyncDot('ok');setTimeout(()=>setSyncDot('idle'),2000);}catch(e){setSyncDot('err');}}
async function saveAssets(){setSyncDot('syncing');try{await gsSet('Aset',assets);setSyncDot('ok');setTimeout(()=>setSyncDot('idle'),2000);}catch(e){setSyncDot('err');}}
async function saveTargets(){setSyncDot('syncing');try{await gsSet('Target',targets);setSyncDot('ok');setTimeout(()=>setSyncDot('idle'),2000);}catch(e){setSyncDot('err');}}

function checkLunas(){
  const curYM=nowY()*12+nowM();
  obls=obls.map(o=>{
    if(!o.lunasHingga)return o;
    const[lY,lM]=o.lunasHingga.split('-').map(Number);
    return{...o,paid:curYM<=lY*12+lM};
  });
}

// Navigation
function go(tab){
  curTab=tab;
  ['beranda','laporan','overview'].forEach(t=>{
    document.getElementById('page-'+t).style.display=t===tab?'':'none';
    // bottom nav
    const icon=document.getElementById('bni-icon-'+t);
    const lbl=document.getElementById('bni-lbl-'+t);
    if(icon){icon.className='bni-icon'+(t===tab?' on':'');}
    if(lbl){lbl.className='bni-lbl'+(t===tab?' on':'');}
    // desktop sidebar
    const sni=document.getElementById('sni-'+t);
    if(sni){sni.style.background=t===tab?'rgba(0,201,167,0.1)':'';sni.style.color=t===tab?'var(--teal)':'var(--txt2)';}
  });
  renderAll();
}

function renderAll(){
  if(curTab==='beranda')renderBeranda();
  if(curTab==='laporan')renderLaporan();
  if(curTab==='overview')renderOverview();
}

          </div>`;
        }).join('')}

  </div>

  <!-- Ringkasan tahunan -->
  <div style="padding:0 16px;margin-bottom:16px;">
    <div class="ccard">
      <div class="ccard-hdr"><h3>Ringkasan ${nowY()}</h3></div>
      <div style="padding:0 16px 12px;">
        ${MN.map((m,i)=>{
          const mI=txList.filter(t=>Number(t.month)===i&&t.type==='in'&&t.currency==='IDR').reduce((s,t)=>s+Number(t.amount),0);
          const mO=txList.filter(t=>Number(t.month)===i&&t.type==='out'&&t.currency==='IDR').reduce((s,t)=>s+Number(t.amount),0);
          if(!mI&&!mO)return'';
          const net=mI-mO;
          return`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);">
            <p style="font-size:12px;font-weight:${i===activeMth?700:400};color:${i===activeMth?'var(--teal)':'var(--txt2)'};">${m}</p>
            <div style="display:flex;gap:14px;">
              <p style="font-size:11px;color:var(--teal);">+${fmt(mI)}</p>
              <p style="font-size:11px;color:var(--red);">-${fmt(mO)}</p>
              <p style="font-size:11px;font-weight:700;color:${net>=0?'var(--teal)':'var(--red)'};">${net>=0?'+':''}${fmt(net)}</p>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <!-- Transaksi list -->
  <div style="padding:0 16px;margin-bottom:16px;">
    <div class="ccard">
      <div class="ccard-hdr">
        <h3>Transaksi ${MN[activeMth]}</h3>
        <div style="display:flex;gap:5px;">
          ${['Semua','Masuk','Keluar'].map(f=>`<button class="pill ${filterTx===f?'on':''}" style="padding:4px 10px;font-size:10px;" onclick="setFilter('${f}')">${f}</button>`).join('')}
        </div>
      </div>
      <div style="padding:0 16px 8px;">
        <input placeholder="🔍 Cari..." value="${searchTx}" oninput="setSearch(this.value)" style="margin-bottom:0;min-height:38px;font-size:12px;background:var(--card2);">
      </div>

        ${filtered.length===0?'<p class="empty">Tidak ada transaksi</p>':
          filtered.map((t,i)=>{
            const ci=OCATS.findIndex(c=>t.cat&&t.cat.includes(c));
            const col=catColor(ci>=0?ci:i);
            return`<div class="tx-item">
              <div class="tx-icon" style="background:${col}18;">${(t.cat||'➕').split(' ')[0]}</div>

                </div>
                <button class="act-btn act-del" onclick="delTx('${t.id}')">🗑️</button>
              </div>
            </div>`;
          }).join('')}
      </div>
    </div>
  </div>`;

  document.getElementById('page-laporan').innerHTML=html;
}

// ── ACTIONS ──────────────────────────────────────
function setMth(i){activeMth=i;renderAll();}
function setFilter(f){filterTx=f;renderAll();}
function setSearch(q){searchTx=q;renderLaporan();}

// Wallet CRUD
function editWallet(id){
  const w=wallets.find(x=>x.id===id);if(!w)return;
  showModal(`<div style="position:relative;"><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="drag-bar"></div><h3>Edit Kantong</h3>
    <label>Nama</label><input id="mWBank" value="${w.bank}">
    <label>Tipe</label><select id="mWType"><option ${w.type==='rekening'?'selected':''}>rekening</option><option ${w.type==='cash'?'selected':''}>cash</option><option ${w.type==='ewallet'?'selected':''}>ewallet</option></select>
    <label>Mata Uang</label><select id="mWCur">${CUR.map(c=>`<option ${w.currency===c?'selected':''}>${c}</option>`).join('')}</select>
    <label>Saldo</label><input id="mWSaldo" type="number" inputmode="numeric" value="${w.balance}">
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveEditWallet('${id}')">Simpan</button></div>`);
}
async function saveEditWallet(id){
  wallets=wallets.map(w=>w.id===id?{...w,bank:v('mWBank'),type:v('mWType'),currency:v('mWCur'),balance:Number(v('mWSaldo'))}:w);
  closeModal();renderAll();await saveWallets();
}
async function delWallet(id){
  if(!confirm('Hapus kantong ini?'))return;
  wallets=wallets.filter(w=>w.id!==id);renderAll();await saveWallets();
}

// Tx
async function delTx(id){
  const t=txList.find(x=>x.id===id);if(!t)return;
  const kembalikan=t.type==='out'&&confirm(`Hapus "${t.note||t.cat}"?\nKembalikan ${fmt(t.amount,t.currency)} ke kantong?`);
  txList=txList.filter(x=>x.id!==id);
  if(kembalikan&&t.walletId){wallets=wallets.map(w=>w.id===t.walletId?{...w,balance:Number(w.balance)+Number(t.amount)}:w);await saveWallets();}
  renderAll();await saveTx();
}

// Budget
function openBudget(id){
  const b=id?budgets.find(x=>x.id===id):null;
  const STD_CATS=[...OICONS.map((ic,i)=>ic+' '+OCATS[i]),'🤲 Derma/Sedekah','🎉 Hiburan','💈 Perawatan','🍼 Bayi','🚗 Transport Saudi'];
  const isCustom=b&&!STD_CATS.includes(b.cat);
  showModal(`<div style="position:relative;"><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="drag-bar"></div><h3>${b?'Edit':'Tambah'} Anggaran</h3>
    <label>Kategori</label>
    <select id="mBCat" onchange="toggleCustomCat(this.value)">
      ${[...STD_CATS,'➕ Lainnya'].map(c=>`<option ${b&&b.cat===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <input id="mBCatCustom" placeholder="Ketik kategori..." style="display:${isCustom?'block':'none'}" value="${isCustom?b.cat:''}">
    <label>Mata Uang</label><select id="mBCur">${CUR.map(c=>`<option ${b&&b.currency===c?'selected':''}>${c}</option>`).join('')}</select>
    <label>Batas Anggaran</label><input id="mBLimit" type="number" inputmode="numeric" placeholder="0" value="${b?b.limit:''}">
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveBudget('${id||''}')">Simpan</button></div>`);
}
function toggleCustomCat(val){const el=document.getElementById('mBCatCustom');if(el)el.style.display=val==='➕ Lainnya'?'block':'none';}
async function saveBudget(id){
  const catSel=v('mBCat');
  const cat=catSel==='➕ Lainnya'?(v('mBCatCustom')||'Lainnya'):catSel;
  const limit=Number(v('mBLimit'));if(!limit)return;
  if(id)budgets=budgets.map(b=>b.id===id?{...b,cat,limit,currency:v('mBCur')}:b);
  else budgets=[...budgets,{id:uid(),cat,limit,currency:v('mBCur')}];
  closeModal();renderAll();await saveBudgets();
}
function editBudget(id){openBudget(id);}
async function delBudget(id){
  if(!confirm('Hapus anggaran?'))return;
  budgets=budgets.filter(b=>b.id!==id);renderAll();await saveBudgets();
}

// Obl
async function delObl(id){
  if(!confirm('Hapus tagihan/cicilan?'))return;
  obls=obls.filter(o=>o.id!==id);renderAll();await saveObls();
}
function openPay(id){
  const o=obls.find(x=>x.id===id);if(!o)return;
  const w=wallets.find(wl=>wl.id===o.walletId);
  window._payObl=o;
  // If walletId not found, use first IDR wallet as default
  const defWalletId = w ? o.walletId : (wallets.find(wl=>wl.currency==='IDR')?.id || wallets[0]?.id || '');
  if(!w && defWalletId) window._payObl = {...o, walletId: defWalletId};
  const dispW = w || wallets.find(wl=>wl.id===defWalletId);
  showModal(`<div style="position:relative;"><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="drag-bar"></div><h3>Konfirmasi Bayar</h3>
    <div style="background:var(--card2);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--border);">
      <p style="font-size:14px;font-weight:700;margin-bottom:3px;">${o.icon} ${o.name}</p>
      <p style="font-size:11px;color:var(--txt2);">${fmt(o.amount)}/bulan</p>
    </div>
    <label>Potong dari Kantong</label>
    <select id="mPayWallet" style="margin-bottom:12px;">

      <input id="mPayBulan" type="number" inputmode="numeric" min="1" max="60" value="1" style="width:65px;min-height:36px;padding:6px 10px;font-size:12px;margin-bottom:0" oninput="updatePayInfo()">

    <div style="background:var(--card2);border-radius:14px;padding:12px;margin-bottom:14px;border:1px solid var(--border);">

        <p id="payTotal" style="font-size:16px;font-weight:700;color:var(--red);">${fmt(o.amount)}</p>
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="payBtn" onclick="confirmPay('${id}')">Bayar 1 Bulan</button></div>`);

function selBulan(n,el){
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('mPayBulan').value=n;
  updatePayInfo();
}
function updatePayInfo(){
  const o=window._payObl;if(!o)return;
  const n=Math.max(1,Number(document.getElementById('mPayBulan')?.value)||1);
  const total=Number(o.amount)*n;
  const untilM=(nowM()+n-1)%12;
  const untilY=nowY()+Math.floor((nowM()+n-1)/12);
  const pi=document.getElementById('payInfo');if(pi)pi.textContent=n>1?`✓ Lunas hingga ${MN[untilM]} ${untilY}`:'';
  const pc=document.getElementById('payCalc');if(pc)pc.textContent=`${n} × ${fmt(o.amount)}`;
  const pt=document.getElementById('payTotal');if(pt)pt.textContent=fmt(total);
  const pb=document.getElementById('payBtn');if(pb)pb.textContent=`Bayar ${n} Bulan`;
}
async function confirmPay(id){
  const o=obls.find(x=>x.id===id);if(!o)return;
  const n=Math.max(1,Number(document.getElementById('mPayBulan')?.value)||1);
  // Use wallet from dropdown (handles old data with missing walletId)
  const selectedWalletId = document.getElementById('mPayWallet')?.value || o.walletId || wallets[0]?.id;
  const tgtM=nowM()+n-1;
  const lunasHingga=`${nowY()+Math.floor(tgtM/12)}-${String(tgtM%12).padStart(2,'0')}`;
  const total=Number(o.amount)*n;
  obls=obls.map(x=>{
    if(x.id!==id)return x;
    const nx={...x,paid:true,lunasHingga,walletId:selectedWalletId};
    if(x.jenis==='cicilan')nx.sudahBulan=Number(x.sudahBulan)+n;
    return nx;
  });
  if(selectedWalletId)wallets=wallets.map(w=>w.id===selectedWalletId?{...w,balance:Number(w.balance)-total}:w);
  closeModal();renderAll();await Promise.all([saveObls(),saveWallets()]);
}
async function undoPay(id){
  const o=obls.find(x=>x.id===id);if(!o)return;
  obls=obls.map(x=>{
    if(x.id!==id)return x;
    const nx={...x,paid:false,lunasHingga:''};
    if(x.jenis==='cicilan')nx.sudahBulan=Math.max(0,Number(x.sudahBulan)-1);
    return nx;
  });
  if(o.walletId)wallets=wallets.map(w=>w.id===o.walletId?{...w,balance:Number(w.balance)+Number(o.amount)}:w);
  renderAll();await Promise.all([saveObls(),saveWallets()]);
}

async function addBayarObl(){
  const id=window._selectedOblId;
  if(!id)return alert('Pilih tagihan dulu!');
  const o=obls.find(x=>x.id===id);if(!o)return;
  const selectedWalletId=v('mBayarWallet')||o.walletId||wallets[0]?.id;
  obls=obls.map(x=>{
    if(x.id!==id)return x;
    const nx={...x,paid:true,lunasHingga:`${nowY()}-${String(nowM()).padStart(2,'0')}`,walletId:selectedWalletId};
    if(x.jenis==='cicilan')nx.sudahBulan=Number(x.sudahBulan)+1;
    return nx;
  });
  if(selectedWalletId)wallets=wallets.map(w=>w.id===selectedWalletId?{...w,balance:Number(w.balance)-Number(o.amount)}:w);
  closeModal();renderAll();await Promise.all([saveObls(),saveWallets()]);
}
async function addTx(){
  if(_txType==='bayar'){
    if(!window._selectedOblId)return alert('Pilih tagihan dulu!');
    await addBayarObl();return;
  }
  const amt=Number(v('mTAmt'));if(!amt)return;
  const walletId=v('mTWallet')||wallets[0]?.id;
  const currency=v('mTCur')||'IDR';
  let cat='';let needSaveBudget=false;
  if(_txType==='in'){
    cat=v('mTCatIn')||'💰 Gaji';
  }else{
    const catSel=v('mTCat');
    if(catSel==='lainnya'){
      const custom=(v('mTCatCustom')||'').trim();
      if(!custom)return alert('Ketik nama kategori dulu!');
      cat='➕ '+custom;
      if(!budgets.find(b=>b.cat===cat)){budgets=[...budgets,{id:uid(),cat,limit:0,currency:'IDR'}];needSaveBudget=true;}
    }else{cat=catSel;}
  }
  // Pakai tanggal custom kalau diisi
  const tglInput = v('mTDate');
  let txDate = nowS();
  let txMonth = nowM();
  if(tglInput) {
    const d = new Date(tglInput);
    txDate = d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
    txMonth = d.getMonth();
  }
  const tx={id:uid(),type:_txType,date:txDate,cat,amount:amt,currency,note:v('mTNote')||cat,walletId,month:txMonth};
  txList=[tx,...txList];
  wallets=wallets.map(w=>w.id===walletId?{...w,balance:Number(w.balance)+(_txType==='in'?amt:-amt)}:w);
  closeModal();renderAll();
  const saves=[saveTx(),saveWallets()];
  if(needSaveBudget)saves.push(saveBudgets());
  await Promise.all(saves);
}
async function addWallet(){
  const bank=v('mWBank');if(!bank)return;
  wallets=[...wallets,{id:uid(),bank,type:v('mWType'),currency:v('mWCur'),balance:Number(v('mWSaldo'))||0}];
  closeModal();renderAll();await saveWallets();
}
async function addObl(){
  const name=v('mOName');const amt=Number(v('mOAmt'));if(!name||!amt)return;
  const jenis=v('mOJenis')||'tagihan';
  const obl={id:uid(),name,icon:v('mOIcon')||'📋',jenis,amount:amt,paid:false,lunasHingga:'',
    totalBulan:Number(v('mOTotal'))||0,sudahBulan:Number(v('mOSudah'))||0,
    keterangan:v('mOKet')||'',walletId:v('mOWallet')||wallets[0]?.id,rutin:jenis==='tagihan'};
  obls=[...obls,obl];closeModal();renderAll();await saveObls();
}
async function doTransfer(){
  const fromId=v('mTrFrom');const toId=v('mTrTo');
  const amt=Number(v('mTrAmt'));const note=v('mTrNote')||'Transfer';
  if(!amt||fromId===toId)return;
  const fromW=wallets.find(w=>w.id===fromId);const toW=wallets.find(w=>w.id===toId);
  if(!fromW||!toW)return;
  if(Number(fromW.balance)<amt)return alert('Saldo tidak cukup!');
  wallets=wallets.map(w=>{
    if(w.id===fromId)return{...w,balance:Number(w.balance)-amt};
    if(w.id===toId)return{...w,balance:Number(w.balance)+amt};
    return w;
  });
  const now=nowS();const mth=nowM();
  txList=[
    {id:uid(),type:'out',date:now,cat:'🔄 Transfer',amount:amt,currency:fromW.currency,note:'Transfer ke '+toW.bank+' · '+note,walletId:fromId,month:mth},
    {id:uid(),type:'in',date:now,cat:'🔄 Transfer',amount:amt,currency:toW.currency,note:'Transfer dari '+fromW.bank+' · '+note,walletId:toId,month:mth},
    ...txList
  ];
  closeModal();renderAll();await Promise.all([saveWallets(),saveTx()]);
}
async function doReset(){
  const pw=document.getElementById('resetPwInput')?.value;
  const errEl=document.getElementById('resetErr');
  if(pw!==RESET_PW){if(errEl)errEl.style.display='';return;}
  if(!confirm('Yakin hapus SEMUA data permanen?'))return;
  wallets=[];txList=[];budgets=[];obls=[];assets=[];targets=[];
  try{localStorage.removeItem('kq_cache');}catch(e){}
  renderAll();
  await Promise.all([saveWallets(),saveTx(),saveBudgets(),saveObls(),saveAssets(),saveTargets()]);
}

// Modal utils
function showModal(content){
  document.getElementById('modalContainer').innerHTML=`<div class="ovl" onclick="closeModal()"><div class="mbox" onclick="event.stopPropagation()">${content}</div></div>`;
}
function closeModal(){document.getElementById('modalContainer').innerHTML='';}
function v(id){const el=document.getElementById(id);return el?el.value:'';}

// Offline
window.addEventListener('online',()=>{document.getElementById('offlineBanner').style.display='none';setSyncDot('idle');loadAll();});
window.addEventListener('offline',()=>{document.getElementById('offlineBanner').style.display='flex';setSyncDot('offline');});

// SW
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}

// Init
if(!navigator.onLine){document.getElementById('offlineBanner').style.display='flex';setSyncDot('offline');}
loadAll();
</script>
